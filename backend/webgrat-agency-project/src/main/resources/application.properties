spring.application.name=webgrat-agency-project

# Server port. Render injects PORT at runtime; locally we default to 8080.
server.port=${PORT:8080}

# Thymeleaf — used by BlogPageController to render /blog and /blog/{slug}.
# Disable template caching in development; set THYMELEAF_CACHE=true in prod.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ── Supabase Postgres (Session Pooler — IPv4 compatible) ──────────────
# Username MUST be  postgres.<project-ref>  so the pooler routes to the
# correct project. All three values are SECRETS — set them as env vars
# in Render (and locally via your IDE run-config or application-local.properties).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Supabase REST / JWT verification ──────────────────────────────────
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:blog-thumbnails}

# ── CORS ──────────────────────────────────────────────────────────────
# Comma-separated list. Override with ALLOWED_ORIGINS in Render to e.g.
#   https://webgrat.com,https://www.webgrat.com
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ── Frontend public URL (used inside transactional emails) ────────────
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── Resend (transactional email) ──────────────────────────────────────
resend.api.key=${RESEND_API_KEY}
email.from=${EMAIL_FROM:Webgrat <hello@webgrat.com>}
email.admin=${EMAIL_ADMIN:webgrat.com@gmail.com}
