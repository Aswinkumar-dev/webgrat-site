spring.application.name=webgrat-agency-project

# Thymeleaf — used by BlogPageController to render /blog and /blog/{slug}.
# Disable template caching in development so edits to .html files are picked
# up on refresh. Flip to true (or remove) in production.
spring.thymeleaf.cache=false

# Supabase Session Pooler (IPv4 compatible).
# IMPORTANT: username must be  postgres.<project-ref>  — the pooler uses
# this to route your connection to the right Supabase project.
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.fpvppqqmkpiihqssytfe
spring.datasource.password=Webgratadmin@2026
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase JWT secret
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}

supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=blog-thumbnails

# CORS ? your Hostinger domain and local dev
allowed.origins=https://webgrat.com,http://localhost:5173

# Frontend public URL (used for unsubscribe links inside emails)
frontend.url=http://localhost:5173

# Resend (transactional email) configuration
resend.api.key=${RESEND_API_KEY}
# Sender used by every transactional email. Until a custom domain is
email.from=Webgrat <hello@webgrat.com>
# Inbox that receives contact-form notifications and (optionally) new
# subscriber pings.
email.admin=webgrat.com@gmail.com
