name: Keep Render backend awake

on:
  schedule:
    # Running every 5 minutes (GitHub's minimum) to stay well within
    # Render's 15-minute idle window, even if GitHub delays the job.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/blogs/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::Repository variable BACKEND_URL is not set."
            echo "Add it under: Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          URL="${BACKEND_URL%/}/api/blogs/health"
          echo "Pinging $URL"

          # Allow up to 60 s for a cold-start wake-up; retry twice in case
          # the very first request races with Render's container boot.
          curl -fsS --max-time 60 --retry 2 --retry-delay 10 \
               -o response.txt -w "HTTP %{http_code} in %{time_total}s\n" \
               "$URL"

          echo "─── response body ───"
          cat response.txt
          echo
          echo "Backend is awake ✓"
